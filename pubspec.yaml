name: smart_shelf_linux
description: "Otto Scents Smart Shelf - Linux Touchscreen Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  fl_chart: ^1.2.0
  intl: ^0.20.2
  http: ^1.3.0
  window_manager: ^0.5.2
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  flutter_riverpod: ^2.6.1
  dio: ^5.11.0
  go_router: ^17.5.0
  supabase_flutter: ^2.9.1
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
